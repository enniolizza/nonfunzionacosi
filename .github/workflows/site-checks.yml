name: Site checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: site-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Official actions/checkout v6; immutable commit, verified on 2026-10-22.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Check content, browser policy and local links
        run: python3 scripts/check_site.py
      - name: Check JavaScript syntax
        run: node --check assets/js/carousel.js
      - name: Check whitespace
        run: git diff --check
