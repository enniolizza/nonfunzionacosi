name: Site checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: site-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # Official actions/checkout v6; immutable commit, verified on 2026-10-22.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check content, browser policy and local links
        run: python3 scripts/check_site.py
      - name: Check removed PDF stays out of Git history
        run: python3 scripts/check_history.py
      - name: Check JavaScript syntax
        run: node --check assets/js/carousel.js
      - name: Check changed whitespace
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            BASE_SHA=$(git hash-object -t tree /dev/null)
          fi
          git diff --check "$BASE_SHA" "$HEAD_SHA"
